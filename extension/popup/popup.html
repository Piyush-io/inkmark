<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inkmark</title>
    <link rel="stylesheet" href="../pages.css" />
    <style>
      html, body { width: 300px; min-height: 0; }
      .box { padding: 14px; }
      .head { display: flex; align-items: center; justify-content: space-between; }
      .stat { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
      .page { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--sunken); }
      .page b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .page span { font-size: 12px; color: var(--muted); }
      .stack { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
      .stack .btn { width: 100%; }
      .split { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .links { display: flex; gap: 2px; margin: 10px -6px 0; padding-top: 8px; border-top: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="head">
        <div class="wordmark">Inkmark</div>
      </div>
      <div class="page" id="page" hidden>
        <b id="page-title"></b>
        <span id="page-count"></span>
      </div>
      <div class="stack">
        <button class="btn mark" id="sidebar">Open sidebar</button>
        <button class="btn" id="ai">Highlight key ideas</button>
        <div class="split" id="md-row" hidden>
          <button class="btn" id="copy-md">Copy Markdown</button>
          <button class="btn" id="download-md">Download .md</button>
        </div>
        <button class="btn" id="pdf" hidden>Highlight this PDF</button>
        <div class="page" id="file-hint" hidden>
          <span>To highlight files on your computer, turn on <b style="display:inline">Allow access to file URLs</b> for Inkmark, then reload this tab.</span>
          <button class="btn small" id="file-access" style="margin-top:8px;width:100%">Open extension settings</button>
        </div>
      </div>
      <div class="links">
        <button class="btn quiet small" id="library">Library</button>
        <button class="btn quiet small" id="docs">Open a document</button>
        <button class="btn quiet small" id="settings">Settings</button>
      </div>
      <p class="stat" id="stat"></p>
    </div>
    <script src="../lib/util.js"></script>
    <script src="../lib/client.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
